services:
  - type: web
    name: my-trading-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u bot.py
    healthCheckPath: /api/health
    disk:
      name: kets-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: KETS_API_KEY
        sync: false
      - key: KETS_SIGNAL_SOURCE_URL
        value: https://kets.onrender.com/api/signals
      - key: KETS_WEBSITE_URL
        value: https://kets.onrender.com
      - key: KETS_SIGNAL_SOURCE_KEY
        sync: false
